container:
  # k8s_deployments removed — SDK 0.3.34 has a bug iterating this dict where it
  # tries to patch a deployment literally named "namespace". We don't need
  # autoconf to restart pods; terraform/k8s handle that on ConfigMap change.
  management_authorization:
    authorization_enforcement: True
    roles:
    - operation: "update"
      name: "Configuration Service"
      users:
      - name: "cfgsvc"
        type: "local"
      features:
      - name: "shared_volume"
        access: "w"
  account_management:
    users:
    - name: "cfgsvc"
      operation: "update"
      password: !secret verify-access/configreader:cfgsvcpw
  ssl_certificates:
  - name: "lmi_trust_store"
    signer_certificates:
    - "postgres.crt"
    - "ldap.crt"
  - name: "rt_profile_keys"
    signer_certificates:
    - "postgres.crt"
  - name: "pdsrv"
    personal_certificates:
    - name: "WRP"
      p12_file: "iviawrprp1.p12"
      secret: !secret verify-access/wrp-p12-creds:secret
    signer_certificates:
    - "iviaop.pem"
  cluster:
    runtime_database:
      host: "postgresql"
      port: 5432
      type: "postgresql"
      user: "postgres"
      password: !secret verify-access/postgresql-creds:password
      ssl: True
      db_name: "ivia"
    dsc:
      client_grace: 600
      connection_idle_timeout: 0
      max_session_lifetime: 3600
      service_port: 9443
      replication_port: 9444
      worker_threads: 64
      servers:
      - ip: "iviadsc"
        service_port: 9443
        replication_port: 9444
  activation: #Activation codes
    trial_license: "ISAM-Trial-HashiCorp.cer"
webseal:
  runtime:
    policy_server: "ldap"
    user_registry: "ldap"
    ldap:
      host: "openldap"
      port: 636
      dn: "cn=root,secAuthority=Default"
      dn_password: !secret verify-access/openldap-creds:admin_password
      key_file: "lmi_trust_store"
    clean_ldap: True
    domain: "Default"
    admin_user: "sec_master"
    admin_password: !secret verify-access/ivia-secauthority-creds:sec_master_password
    admin_cert_lifetime: 1460
    ssl_compliance: "fips"
  http_transforms:
    lua:
    - "req_openid_config.lua"
    - "rsp_openid_config.lua"
  pdadmin:
    users:
    - username: "oscar"
      password: "WorkshopUser1!"
      dn: "cn=oscar,dc=ibm,dc=com"
      first_name: "Oscar"
      last_name: "Medina"
    acls:
    - name: "unauth"
      users:
      - name: "sec_master"
        permissions: "TcmdbsvaBRrxl"
      any_other: "Tr"
      unauthenticated: "Tr"
    reverse_proxies:
    - host: "www.iamlab.ibm.com"
      instance: "rp1"
      acls:
      - name: "unauth"
        junctions:
        - "/isvaop/oauth2/.well-known"
        - "/isvaop/oauth2/token"
        - "/isvaop/oauth2/jwks"
        - "/isvaop/oauth2/ciba"
  reverse_proxy:
  - name: "rp1"
    host: "www.iamlab.ibm.com"
    http:
      enabled: "no"
    https:
      enabled: "yes"
    domain: "Default"
    ldap:
      ssl: "yes"
      port: 636
      key_file: "lmi_trust_store"
    junctions:
    - junction_point: "/isvaop"
      description: "Verify Identiy Access OIDC OP Container"
      junction_type: "ssl"
      server_hostname: "iviaop"
      server_port: 8436
    stanza_configuration:
    - stanza: "ssl"
      entry_id: "webseal-cert-keyfile-label"
      value: "WRP"
      operation: "update"
    - stanza: "http-transformations"
      entry_id: "req_openid"
      value: "req_openid_config.lua"
      operation: "add"
    - stanza: "http-transformations"
      entry_id: "rsp_openid"
      value: "rsp_openid_config.lua"
      operation: "add"
    - stanza: "http-transformations:req_openid"
      operation: "add"
    - stanza:  "http-transformations:req_openid"
      operation: "add"
      entry_id: "request-match"
      value: "request:GET /isvaop/oauth2/.well-known/oauth-authorization-server *"
    - stanza: "http-transformations:rsp_openid"
      operation: "add"
    - stanza:  "http-transformations:rsp_openid"
      operation: "add"
      entry_id: "request-match"
      value: "response:GET /isvaop/oauth2/.well-known/oauth-authorization-server *"
    # JWT identity injection on the /isvaop junction so iviaop receives the
    # authenticated WebSEAL user as iv-jwt. WebSEAL signs with the WRP cert
    # (already in pdsrv keystore); iviaop validates via the signer chain.
    - stanza: "jwt"
      operation: "add"
      entry_id: "jct-id"
      value: "+/isvaop"
    - stanza: "jwt:/isvaop"
      operation: "add"
    - stanza: "jwt:/isvaop"
      operation: "add"
      entry_id: "key-label"
      value: "WRP"
    - stanza: "jwt:/isvaop"
      operation: "add"
      entry_id: "hdr-name"
      value: "iv-jwt"
    - stanza: "jwt:/isvaop"
      operation: "add"
      entry_id: "claim"
      value: "attr::AZN_CRED_PRINCIPAL_NAME::sub"
    - stanza: "jwt:/isvaop"
      operation: "add"
      entry_id: "lifetime"
      value: "120"
