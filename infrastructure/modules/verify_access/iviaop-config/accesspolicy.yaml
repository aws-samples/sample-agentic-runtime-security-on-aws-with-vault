rules:
  access_policy:
    - name: isvaop_policy
      content : |
        importClass(Packages.com.tivoli.am.fim.trustserver.sts.utilities.IDMappingExtUtils);

        // Runs at /oauth2/authorize for every client on the OIDC definition
        // (provider.yml definition.access_policy_id: isvaop_policy). The OscarVault
        // banking app is a FIRST-PARTY client (client_id agent-uc2): the user is
        // signing in to their own bank's own app, so an OAuth scope-consent page is
        // inappropriate. Consent screens exist for THIRD-PARTY delegation, not for a
        // first-party app asking the user to "authorize" itself. For agent-uc2 we
        // supply the consent decision externally (exactly the requested scopes) via
        // setConsentDecision(), so ISVAOP issues the authorization code WITHOUT
        // rendering its consent page. This is IBM's documented external-consent
        // pattern: "the information of consented scope can be passed on by calling
        // setConsentDecision()".
        //
        // Every OTHER client supplies no decision and falls through to the global
        // consent_prompt: ALWAYS_PROMPT (provider.yml) — least privilege, so a
        // future third-party browser client is never silently auto-consented. CIBA
        // (agent-uc3 refund) never hits /oauth2/authorize, so the refund approval
        // flow is untouched.
        //
        // ISVAOP 25.10 access-policy API (verified against IBM "Access Policy
        // Reference": https://docs.verify.ibm.com/ibm-security-verify-access/docs/js_access_policy):
        //   getClientId() -> string
        //   getAuthenticationRequest().getAuthenticationContext().getScope() -> string[]
        //   setConsentDecision(string[])
        var pctx = context.getProtocolContext();
        var clientId = "" + pctx.getClientId();
        IDMappingExtUtils.traceString("[isvaop_policy] authorize client_id=" + clientId);

        if (clientId == "agent-uc2") {
            var scopes = pctx.getAuthenticationRequest()
                             .getAuthenticationContext()
                             .getScope();
            pctx.setConsentDecision(scopes);
            IDMappingExtUtils.traceString("[isvaop_policy] first-party auto-consent for agent-uc2 scopes=" + scopes);
        }

        context.setDecision(Decision.allow());
