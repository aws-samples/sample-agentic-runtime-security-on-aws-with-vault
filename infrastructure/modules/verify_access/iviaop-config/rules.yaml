rules:
  mapping:
    - name: notifyuser
      content: |
        // InternalAuthenticator: OIDC Provider delegates the consent page to WRP.
        // WRP serves the login page + /isvaop/oauth2/ciba_user_authorize/{transactionID}
        // consent page. The current rule does nothing but pick InternalAuthenticator.
        //
        // OUTBOUND HTTP FROM notifyuser -- VERIFIED LIVE 2026-05-23 (ivia-oidc-provider:25.10).
        // A prior comment here claimed "the notifyuser sandbox has no HTTP client". That is
        // WRONG. notifyuser CAN make outbound HTTP calls. The gotchas (all tested live):
        //   1. The Rhino sandbox strips the `Packages` reflection root for bare expressions
        //      (`Packages.x.y.Z` -> "ReferenceError: Packages is not defined").
        //   2. `HttpClientV2` and `HttpClient` are NOT pre-bound globals (typeof == undefined).
        //   3. But `importClass(Packages.com.ibm.security.access.httpclient.HttpClientV2)`
        //      DOES bind it, and the call then works. (v1 `HttpClient` does NOT import --
        //      only HttpClientV2.) Signature (see IBM util_http doc):
        //        HttpClientV2.httpPost(url, headers, body, httpsTrustStore,
        //          basicUser, basicPass, clientKeyStore, clientKeyAlias, protocol,
        //          throwExec, timeoutSecs, sendAsJson, proxyServer)
        //      A POST to in-cluster http://uc3-agent-svc.banking-app.svc.cluster.local:8080
        //      returned a real HTTP status (no truststore needed for plain http://).
        //
        // HOW TO PUSH THE CIBA CONSENT URL TO THE WORKSHOP USER (Option A, not yet wired):
        //   importClass(Packages.com.ibm.security.access.httpclient.HttpClientV2);
        //   importClass(Packages.com.tivoli.am.fim.trustserver.sts.utilities.IDMappingExtUtils);
        //   var url = ciba.getUserAuthorizeEndpoint();          // consent URL (internal host)
        //   var hdr = new java.util.HashMap(); hdr.put("Content-Type","application/json");
        //   var body = JSON.stringify({auth_req_id: ciba.getAuthRequestID(), consent_url: url});
        //   var resp = HttpClientV2.httpPost("http://uc3-agent-svc.banking-app.svc.cluster.local:8080/api/ciba/pending",
        //                hdr, body, null, null, null, null, null, null, false, 5, true, null);
        //   IDMappingExtUtils.traceString("notifyuser push code=" + resp.getCode());
        //   // banking backend stores it; banking-ui polls + shows an Approve button -> url.
        // NOTE: bc-authorize for client agent-uc3 REQUIRES a user_code (FBTAQ5508E if absent).
        ciba.setAuthenticator(new InternalAuthenticator());
    - name: checkstatus
      content: |
        /**
        * Copyright contributors to the IBM Security Verify Access OIDC Provider Resources project
        */
        importClass(Packages.com.tivoli.am.fim.trustserver.sts.utilities.IDMappingExtUtils);
        
        IDMappingExtUtils.traceString("Starting CheckStatus JS");
        IDMappingExtUtils.traceString("Auth Request ID: " + ciba.getAuthRequestID());
        
        /**
        * What is expected to be done here:
        * - Calling the configured check status endpoint to get the latest authentication status
        *   Use http module to make http callout
        * - Populate user metadata in the case of successful authentication
        *   The metadata serve as credential attributes that can be used for grant enrichment
        *   At least the metadata should contain 'uid' claim (or claim indicated in 'subject_attribute_name')
        *   as this will be used as the 'sub' in id_token
        * - Send the status back using one of the method: pending(), failed() or success()
        */
        if (ciba.getCheckStatusEndpoint() == "https://checkstatus.com?status=fail") { // for demo 
            ciba.failed(); // user rejected
        } else if (ciba.getCheckStatusEndpoint() == "https://checkstatus.com?status=pass") { // for demo

            var meta = {};
            meta["uid"] = "25202QWRUA";
            meta["email"] = "asmith@test.com";
            meta["preferred_username"] = "asmith";
            meta["given_name"] = "Alex";
            meta["family_name"] = "Smith";
            ciba.success(meta); // user has been authenticated

        } else {
            ciba.pending(); // waiting for user's response
        }
    - name: idmap
      content: |
        // Mapping rule invoked by the OAuth 2.0 token-exchange grant. ISVAOP binds
        // it by the fixed name `idmap`; it MUST exist or the exchange returns 404
        // ("Precompiled script mappingrule/idmap.js does not exist"). Used to
        // validate the incoming subject. Claim enrichment (may_act) happens in the
        // pre-token rule, not here — tokenData assignments do not land from idmap.
        importClass(Packages.com.tivoli.am.fim.trustserver.sts.utilities.IDMappingExtUtils);
        IDMappingExtUtils.traceString("UC3 idmap fired sub=" + stsuu.getPrincipalName());
    - name: isvaop_pretoken
      content: |
        // pre_mappingrule_id — runs before every access token is minted. For the
        // RFC 8693 token-exchange grant ONLY, inject the may_act delegation claim
        // so Vault's uc3-jwt role (bound_claims {"/may_act/sub":"*"}) accepts the
        // exchanged JWT. Gated on grant_type so authorization_code / CIBA /
        // client_credentials tokens for the other use cases are left untouched.
        importClass(Packages.com.tivoli.am.fim.trustserver.sts.utilities.IDMappingExtUtils);
        var gt = stsuu.getContextAttributes().getAttributeValueByName("grant_type");
        if (gt == "urn:ietf:params:oauth:grant-type:token-exchange") {
          tokenData["may_act"] = { "sub": "uc3-actor" };
          IDMappingExtUtils.traceString("UC3 pretoken injected may_act for token-exchange");
        }