rules:
  mapping:
    - name: notifyuser
      content: |
        // UC3 mobile-push CIBA. Route refund consent to the user's IBM Verify device
        // instead of browser consent. uc3-agent fires the MMFA push itself right after
        // bc-authorize (identity taken from the authenticated banking session, never a
        // parameter), so this rule only has to wire CIBA completion to a server-polled
        // check-status endpoint on uc3-agent.
        //
        // ExternalAuthenticatorWithCheckStatusEndpoint(checkStatusEndpoint, bearer):
        // ISVAOP PUTs checkStatusEndpoint on every token poll (see the checkstatus
        // rule); uc3-agent reports SUCCESS only when the user's OWN SCIM MMFA
        // transaction -- the exact one uc3-agent fired -- resolves to SUCCESS, so the
        // approval is unforgeable and requires the physical device tap. The bearer is
        // surfaced to checkstatus via ciba.getBearerToken() and replayed to uc3-agent
        // as a per-request shared secret (defense-in-depth on top of the SCIM gate).
        // The authenticator classes are pre-bound in the ciba rule sandbox (same as
        // the InternalAuthenticator this replaces) -- no importClass needed.
        importClass(Packages.com.tivoli.am.fim.trustserver.sts.utilities.IDMappingExtUtils);
        var authReqId = "" + ciba.getAuthRequestID();
        var bearer    = "" + ciba.getBearerToken();
        var statusUrl = "http://uc3-agent-svc.banking-app.svc.cluster.local:8080/api/ciba/status?auth_req_id=" + authReqId;
        IDMappingExtUtils.traceString("UC3 notifyuser -> ExternalAuthenticatorWithCheckStatusEndpoint auth_req_id=" + authReqId);
        ciba.setAuthenticator(new ExternalAuthenticatorWithCheckStatusEndpoint(statusUrl, bearer));
    - name: checkstatus
      content: |
        // UC3 mobile-push CIBA check-status. ISVAOP runs this on every token poll.
        // PUT the check-status endpoint (uc3-agent) with the CIBA bearer; uc3-agent
        // looks up the MMFA transaction it fired for this auth_req_id, reads the
        // user's OWN SCIM transaction status, and returns a small JSON body:
        //   {"status":"approved","uid":"<user>"} | {"status":"denied"} | {"status":"pending"}
        // uid is bound as the id_token 'sub' via meta[subject_attribute_name] (=sub,
        // provider.yml). uc3-agent matches the
        // EXACT fired transactionId (never "any SUCCESS for the user"), so a stale or
        // unrelated SUCCESS cannot complete this flow.
        //
        // httpPut(url,header,body,trustStore,user,pass,keyStore,keyAlias,proto,
        //         throwExec,timeoutSecs,sendAsJson,proxy) -- importClass HttpClient
        // BEFORE HttpClientV2 (the V2 import only resolves once the package is loaded).
        importClass(Packages.com.tivoli.am.fim.trustserver.sts.utilities.IDMappingExtUtils);
        importClass(Packages.com.ibm.security.access.httpclient.HttpClient);
        importClass(Packages.com.ibm.security.access.httpclient.HttpClientV2);
        importClass(Packages.com.ibm.security.access.httpclient.Headers);

        var url    = "" + ciba.getCheckStatusEndpoint();
        var bearer = "" + ciba.getBearerToken();

        var headers = new Headers();
        headers.addHeader("Content-Type", "application/json");
        headers.addHeader("Authorization", "Bearer " + bearer);

        var resp = HttpClientV2.httpPut(url, headers, "{}", null, null, null, null, null, null, null, null, true, null);

        if (resp == null || resp.hasError()) {
          IDMappingExtUtils.traceString("UC3 checkstatus: transport error -> pending");
          ciba.pending();
        } else {
          var code    = resp.getCode();
          var bodyStr = "" + resp.getBody();
          IDMappingExtUtils.traceString("UC3 checkstatus code=" + code + " body=" + bodyStr);
          var status = "pending";
          var uid    = null;
          try {
            var pl = JSON.parse(bodyStr);
            if (pl != null && pl.status != null) { status = "" + pl.status; }
            if (pl != null && pl.uid != null)    { uid    = "" + pl.uid; }
          } catch (e) {
            IDMappingExtUtils.traceString("UC3 checkstatus JSON parse error: " + e);
          }
          if (code == 200 && status == "approved" && uid != null) {
            var meta = {};
            meta["sub"] = uid;  // provider.yml subject_attribute_name=sub -> id_token sub
            ciba.success(meta);
          } else if (code == 200 && status == "denied") {
            ciba.failed();
          } else {
            ciba.pending();
          }
        }
    - name: idmap
      content: |
        // Mapping rule invoked by the OAuth 2.0 token-exchange grant. ISVAOP binds
        // it by the fixed name `idmap`; it MUST exist or the exchange returns 404
        // ("Precompiled script mappingrule/idmap.js does not exist"). Used to
        // validate the incoming subject. Claim enrichment (may_act) happens in the
        // pre-token rule, not here — tokenData assignments do not land from idmap.
        importClass(Packages.com.tivoli.am.fim.trustserver.sts.utilities.IDMappingExtUtils);
        IDMappingExtUtils.traceString("UC3 idmap fired sub=" + stsuu.getPrincipalName());
    - name: isvaop_pretoken
      content: |
        // pre_mappingrule_id — runs before every access token is minted. Stamps the
        // claims Vault's NATIVE OAuth-resource-server / Agent-Registry OBO resolves
        // (Phase 09 native cutover — supersedes the retired vault_jwt_auth_backend).
        //
        // UC3 (RFC 8693 token-exchange grant): stamp
        //   (1) act = { sub: uc3-actor }   — the RFC 8693 ACTOR claim. Vault's native
        //       OBO resolves the acting AGENT from act.sub and IGNORES may_act
        //       (09-DISCOVERY DECISIVE probe: act.sub -> HTTP 200 / resolves;
        //       may_act.sub -> HTTP 403 / ignored). Without act, native UC3 fails
        //       CLOSED (human is an unresolved bare subject). LOAD-BEARING.
        //   (2) may_act = { sub: uc3-actor } — RETAINED for RFC 8693 "authorized-to-act"
        //       semantics + the three-plane audit story. Vault reads act, not may_act.
        //   (3) authorization_details:
        //         - refund_approval        — business RAR (audit correlation; unchanged).
        //         - vault:path_access      — Vault-native per-request RAR; path +
        //           capabilities are pinned by 09-DISCOVERY (UC3_RAR_PATH /
        //           UC3_RAR_CAPS) and set from IVIA's authorization context, NEVER
        //           from an agent-supplied value (T-09-04-01 path-injection).
        //   (4) jti  — Vault schema-MANDATORY (a jti-less token -> 403 "claim jti/uti
        //       is missing"). ISVAOP mints a native UNIQUE UUID jti on every at+jwt
        //       access token (verified live: distinct UUID jti on both the authcode and
        //       token-exchange outputs), satisfying Vault + the T-09-04-04 replay guard.
        //       The rule stamps NO jti: the former java.util.UUID mint used the Rhino
        //       `Packages` Java bridge, absent in the ISVAOP V8 engine — it threw
        //       "ReferenceError: Packages is not defined" and failed the whole mint.
        //
        // UC2 (authorization_code grant, gated on the agent-uc2 CLIENT): UC2 is OBO
        // (09-DISCOVERY CORRECTED: agent = agent-uc2). Stamp act = { sub: agent-uc2 }
        // (the actor claim Vault's OBO resolves the UC2 agent from — same mechanism as
        // UC3's act.sub); the native ISVAOP jti covers the replay-guard need. The gate
        // is on the CLIENT (agent-uc2) via oauth_client.getClientId(), not grant_type
        // alone, so
        // unrelated authorization_code tokens are never given the UC2 agent identity
        // (T-09-04-08 spoofing). UC2's human sub (oscar/jaime) already rides the login
        // token — untouched. UC2 emits NO vault:path_access RAR: 09-DISCOVERY pins no
        // UC2 RAR path (RAR OPTIONAL); UC2 = human-baseline ∩ agent-uc2 ceiling.
        //
        // WHY the refund amount is not a token claim (VERIFIED ISVAOP 25.10 + IBM docs
        // tasks-rar / js_ciba_mapping_rule, 2026-05-29): the consent-time RAR
        // amount/currency jaime approved is NOT exposed to any mapping rule at the CIBA
        // mint or the token-exchange stage. RAR is a context attribute only on the
        // request that CARRIES it (bc-authorize); it is returned as a token-RESPONSE
        // field (not a JWT claim); `strategy` (sha512) is an identifier hash, not a
        // propagation switch; and the ciba object exposes no authorization_details
        // accessor. So the amount CANNOT be made a Vault-validated JWT claim here.
        // `refund_approval` is the genuine, allowlisted, only RAR type jaime can approve
        // (provider authorization_details_types_supported) — not a placeholder. The
        // amount is consent-bound by three-plane audit correlation on request_id (IVIA
        // approval -> Vault auth -> pgaudit DB write), which is also the only sound
        // control: Vault bound_claims are string/glob matches and cannot numerically
        // enforce an amount. See verify_access/README.md "UC3 RAR enforcement model".
        importClass(Packages.com.tivoli.am.fim.trustserver.sts.utilities.IDMappingExtUtils);
        var ctxAttrs = stsuu.getContextAttributes();
        var gt = ctxAttrs.getAttributeValueByName("grant_type");
        // TEMP DIAG (remove after UC2 gate pinned) — log grant_type + client accessor
        // on every mint so we can see why the UC2 authcode branch is skipped.
        try {
          var _doc = (typeof oauth_client !== "undefined" && oauth_client) ? ("" + oauth_client.getClientId()) : "NO_OAUTH_CLIENT";
          var _dctx = "" + ctxAttrs.getAttributeValueByName("client_id");
          IDMappingExtUtils.traceString("PRETOKEN-DIAG gt=[" + gt + "] oauth_client.getClientId=[" + _doc + "] ctxAttrs.client_id=[" + _dctx + "]");
        } catch (e) { IDMappingExtUtils.traceString("PRETOKEN-DIAG client-read error: " + e); }
        if (gt == "urn:ietf:params:oauth:grant-type:token-exchange") {
          // UC3 delegated (OBO) token — act.sub is what Vault's native OBO resolves.
          tokenData["act"]     = { "sub": "uc3-actor" };
          tokenData["may_act"] = { "sub": "uc3-actor" };
          tokenData["authorization_details"] = [
            { "type": "refund_approval" },
            { "type": "vault:path_access", "path": "database/creds/uc3-refund-writer", "capabilities": ["read"] }
          ];
          // jti: ISVAOP mints a native unique UUID jti on every at+jwt access token
          // (Vault schema-satisfied) — the rule stamps none. The former
          // Packages.java.util.UUID call is absent in the ISVAOP V8 engine and threw
          // "ReferenceError: Packages is not defined", failing the whole token mint.
          IDMappingExtUtils.traceString("UC3 pretoken stamped act+may_act=uc3-actor + authorization_details[refund_approval, vault:path_access=database/creds/uc3-refund-writer] on token-exchange output (native jti)");
        } else if (gt == "authorization_code") {
          // UC2 OBO — stamp the agent actor ONLY on the agent-uc2 client's token, so
          // no unrelated authorization_code client can spoof the UC2 agent identity.
          // The requesting client is read from the oauth_client object (IBM-documented
          // pre_token accessor) — NOT stsuu context attributes, which do not carry
          // client_id at pre-token time (that gate silently returned null, so act was
          // never stamped and Vault 403'd UC2). grant_type still comes from ctxAttrs.
          var cid = oauth_client.getClientId();
          if (cid == "agent-uc2") {
            tokenData["act"] = { "sub": "agent-uc2" };
            IDMappingExtUtils.traceString("UC2 pretoken stamped act=agent-uc2 on agent-uc2 authorization_code output (native jti)");
          }
        }