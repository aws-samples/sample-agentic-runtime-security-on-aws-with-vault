<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 56" role="img" aria-label="OscarVault International (OVI)">
  <title>OscarVault International (OVI)</title>

  <!-- ===== Shield mark with OVI monogram (horizontal nav lockup) =====
       Derived from assets/oscarvault-logo.svg: identical shield path, colors
       (#0f62fe fill / #0043ce stroke), OVI monogram, and IBM Plex Sans. -->
  <g transform="translate(27 28) scale(0.46)">
    <path d="M0,-42 L37,-30 V3 C37,27 21,41 0,47 C-21,41 -37,27 -37,3 V-30 Z" fill="#0f62fe"/>
    <path d="M0,-42 L37,-30 V3 C37,27 21,41 0,47 C-21,41 -37,27 -37,3 V-30 Z" fill="none" stroke="#0043ce" stroke-width="1.5"/>
    <text x="0" y="9" text-anchor="middle"
          font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="25" font-weight="700" letter-spacing="0.5" fill="#ffffff">OVI</text>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="58" y="27"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="600" letter-spacing="-0.5" fill="#161616">OscarVault</text>

  <!-- ===== Sub-wordmark ===== -->
  <text x="59" y="44"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="8" font-weight="500" letter-spacing="3.2" fill="#697077">INTERNATIONAL (OVI)</text>
</svg>
