<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" style="background:#0d1117; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;">

  <rect width="1600" height="940" fill="#0d1117"/>

  <!-- ===== TITLE ===== -->
  <text x="40" y="40" fill="white" font-size="24" font-weight="bold">Audit Correlation — One Refund, Three Planes</text>
  <text x="40" y="62" fill="#8b949e" font-size="13">The agent threads one request_id through its hops; Athena stitches three logs into one forensic row — request_id joins IVIA&#8596;pgaudit, path+time bridges Vault</text>

  <!-- OBJ-5 badge top-right -->
  <rect x="1418" y="22" width="162" height="36" rx="18" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="1438" y="45" fill="#f87171" font-size="12" font-weight="bold">OBJ-5</text>
  <text x="1486" y="45" fill="#fca5a5" font-size="11">audit evidence</text>

  <!-- ===== DEFS ===== -->
  <defs>
    <marker id="ac-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f97316"/></marker>
    <marker id="ac-blue"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
    <marker id="ac-teal"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#14b8a6"/></marker>
    <marker id="ac-green"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/></marker>
    <marker id="ac-red"    markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker>
  </defs>

  <!-- ================================================================== -->
  <!-- SECTION 1 — RUNTIME SEQUENCE                                        -->
  <!-- ================================================================== -->
  <text x="40" y="98" fill="#c9d1d9" font-size="14" font-weight="bold">1 · Runtime — request_id propagates through every hop (Use Case 3 sequence)</text>

  <!-- lifeline headers -->
  <!-- User -->
  <rect x="85" y="120" width="130" height="50" rx="8" fill="#0c2417" stroke="#22c55e" stroke-width="1.5"/>
  <text x="150" y="148" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">User</text>
  <text x="150" y="163" fill="#8b949e" font-size="9" text-anchor="middle">Oscar / Jaime</text>

  <!-- IVIA -->
  <rect x="325" y="120" width="130" height="50" rx="8" fill="#1c1108" stroke="#f97316" stroke-width="1.5"/>
  <text x="390" y="148" fill="#fb923c" font-size="13" font-weight="bold" text-anchor="middle">IVIA</text>
  <text x="390" y="163" fill="#8b949e" font-size="9" text-anchor="middle">OIDC Provider</text>

  <!-- Strands agent -->
  <rect x="575" y="120" width="130" height="50" rx="8" fill="#0a1626" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="640" y="148" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">Strands agent</text>
  <text x="640" y="163" fill="#8b949e" font-size="9" text-anchor="middle">EKS pod</text>

  <!-- Vault -->
  <rect x="825" y="120" width="130" height="50" rx="8" fill="#0d1117" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="890" y="148" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">Vault</text>
  <text x="890" y="163" fill="#8b949e" font-size="9" text-anchor="middle">OAuth res srv</text>

  <!-- RDS -->
  <rect x="1085" y="120" width="130" height="50" rx="8" fill="#0d1117" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="1150" y="148" fill="#2dd4bf" font-size="13" font-weight="bold" text-anchor="middle">RDS</text>
  <text x="1150" y="163" fill="#8b949e" font-size="9" text-anchor="middle">Postgres</text>

  <!-- Bedrock KB -->
  <rect x="1345" y="120" width="130" height="50" rx="8" fill="#0d1117" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="1410" y="148" fill="#2dd4bf" font-size="13" font-weight="bold" text-anchor="middle">Bedrock KB</text>
  <text x="1410" y="163" fill="#8b949e" font-size="9" text-anchor="middle">retrieval</text>

  <!-- lifelines -->
  <line x1="150"  y1="170" x2="150"  y2="462" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="390"  y1="170" x2="390"  y2="462" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="640"  y1="170" x2="640"  y2="462" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="890"  y1="170" x2="890"  y2="462" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1150" y1="170" x2="1150" y2="462" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1410" y1="170" x2="1410" y2="462" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- sequence steps -->
  <!-- 1: User -> IVIA  authn -->
  <text x="270" y="227" fill="#c9d1d9" font-size="10" text-anchor="middle">authn · <tspan fill="#fde68a">request_id</tspan></text>
  <line x1="160" y1="240" x2="380" y2="240" stroke="#f97316" stroke-width="2" marker-end="url(#ac-orange)"/>
  <circle cx="270" cy="240" r="11" fill="#f97316"/>
  <text x="270" y="244" fill="white" font-size="11" font-weight="bold" text-anchor="middle">1</text>

  <!-- 2: IVIA -> Strands  JWT -->
  <text x="515" y="272" fill="#c9d1d9" font-size="10" text-anchor="middle">JWT · <tspan fill="#fde68a">request_id</tspan></text>
  <line x1="400" y1="285" x2="630" y2="285" stroke="#f97316" stroke-width="2" marker-end="url(#ac-orange)"/>
  <circle cx="515" cy="285" r="11" fill="#f97316"/>
  <text x="515" y="289" fill="white" font-size="11" font-weight="bold" text-anchor="middle">2</text>

  <!-- 3: Strands -> Vault  login -->
  <text x="765" y="317" fill="#c9d1d9" font-size="10" text-anchor="middle">login · <tspan fill="#fde68a">request_id</tspan></text>
  <line x1="650" y1="330" x2="880" y2="330" stroke="#3b82f6" stroke-width="2" marker-end="url(#ac-blue)"/>
  <circle cx="765" cy="330" r="11" fill="#3b82f6"/>
  <text x="765" y="334" fill="white" font-size="11" font-weight="bold" text-anchor="middle">3</text>

  <!-- 4: Vault -> Strands  creds (return) -->
  <text x="765" y="362" fill="#c9d1d9" font-size="10" text-anchor="middle">JIT creds · <tspan fill="#fde68a">request_id</tspan></text>
  <line x1="880" y1="375" x2="650" y2="375" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ac-green)"/>
  <circle cx="765" cy="375" r="11" fill="#22c55e"/>
  <text x="765" y="379" fill="white" font-size="11" font-weight="bold" text-anchor="middle">4</text>

  <!-- 5: Strands -> RDS  query -->
  <text x="895" y="402" fill="#c9d1d9" font-size="10" text-anchor="middle">query · <tspan fill="#fde68a">request_id</tspan></text>
  <line x1="650" y1="415" x2="1140" y2="415" stroke="#14b8a6" stroke-width="2" marker-end="url(#ac-teal)"/>
  <circle cx="895" cy="415" r="11" fill="#14b8a6"/>
  <text x="895" y="419" fill="white" font-size="11" font-weight="bold" text-anchor="middle">5</text>

  <!-- 6: Strands -> Bedrock KB  retrieve -->
  <text x="1025" y="437" fill="#c9d1d9" font-size="10" text-anchor="middle">retrieve · <tspan fill="#fde68a">request_id</tspan></text>
  <line x1="650" y1="450" x2="1400" y2="450" stroke="#14b8a6" stroke-width="2" marker-end="url(#ac-teal)"/>
  <circle cx="1025" cy="450" r="11" fill="#14b8a6"/>
  <text x="1025" y="454" fill="white" font-size="11" font-weight="bold" text-anchor="middle">6</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="40" y1="492" x2="1560" y2="492" stroke="#30363d" stroke-width="1"/>

  <!-- ================================================================== -->
  <!-- SECTION 2 — FORENSIC JOIN                                           -->
  <!-- ================================================================== -->
  <text x="40" y="522" fill="#c9d1d9" font-size="14" font-weight="bold">2 · Forensics — Athena stitches three logs: request_id joins IVIA&#8596;pgaudit, path+time bridges Vault (VIEW: audit_correlation)</text>

  <!-- connectors: lifeline -> its log plane -->
  <line x1="390"  y1="462" x2="290"  y2="545" stroke="#f97316" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.55"/>
  <line x1="890"  y1="462" x2="730"  y2="545" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.55"/>
  <line x1="1150" y1="462" x2="1170" y2="545" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.55"/>

  <!-- IVIA decision log -->
  <rect x="110" y="545" width="360" height="165" rx="10" fill="#1c1108" stroke="#f97316" stroke-width="1.5"/>
  <text x="130" y="575" fill="#fb923c" font-size="14" font-weight="bold">IVIA decision log</text>
  <text x="130" y="593" fill="#8b949e" font-size="10">authn · RAR · CIBA approval</text>
  <text x="130" y="626" fill="#fde68a" font-size="12" font-weight="bold">request_id</text>
  <text x="130" y="650" fill="#c9d1d9" font-size="12">user_approved_sub</text>
  <text x="130" y="674" fill="#c9d1d9" font-size="12">act.sub · rar_type</text>

  <!-- Vault audit log -->
  <rect x="550" y="545" width="360" height="165" rx="10" fill="#0a1626" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="570" y="575" fill="#60a5fa" font-size="14" font-weight="bold">Vault audit log</text>
  <text x="570" y="593" fill="#8b949e" font-size="10">X-Vault-Token · dynamic lease</text>
  <text x="570" y="626" fill="#93c5fd" font-size="12" font-weight="bold">no request_id — actor_entity · JTI</text>
  <text x="570" y="650" fill="#c9d1d9" font-size="12">vault_principal · path</text>
  <text x="570" y="674" fill="#c9d1d9" font-size="12">credential_ttl (300s)</text>

  <!-- RDS pgaudit log -->
  <rect x="990" y="545" width="360" height="165" rx="10" fill="#07221f" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="1010" y="575" fill="#2dd4bf" font-size="14" font-weight="bold">RDS pgaudit log</text>
  <text x="1010" y="593" fill="#8b949e" font-size="10">DB write to banking.refunds</text>
  <text x="1010" y="626" fill="#fde68a" font-size="12" font-weight="bold">request_id</text>
  <text x="1010" y="650" fill="#c9d1d9" font-size="12">db_write_time</text>
  <text x="1010" y="674" fill="#c9d1d9" font-size="12">db_command (WRITE,INSERT)</text>

  <!-- JOIN arrows: each plane -> Athena -->
  <line x1="290"  y1="712" x2="555" y2="770" stroke="#ef4444" stroke-width="2" marker-end="url(#ac-red)"/>
  <line x1="730"  y1="712" x2="620" y2="770" stroke="#ef4444" stroke-width="2" marker-end="url(#ac-red)"/>
  <line x1="1170" y1="712" x2="690" y2="770" stroke="#ef4444" stroke-width="2" marker-end="url(#ac-red)"/>

  <!-- Athena box -->
  <rect x="460" y="772" width="320" height="92" rx="10" fill="#2a0e0e" stroke="#ef4444" stroke-width="2"/>
  <text x="620" y="806" fill="#f87171" font-size="15" font-weight="bold" text-anchor="middle">Amazon Athena</text>
  <text x="620" y="826" fill="#c9d1d9" font-size="11" text-anchor="middle">audit_correlation VIEW</text>
  <text x="620" y="845" fill="#fde68a" font-size="11" text-anchor="middle">JOIN: request_id + path/time</text>

  <!-- Athena -> combined trace -->
  <line x1="780" y1="818" x2="838" y2="818" stroke="#ef4444" stroke-width="2.5" marker-end="url(#ac-red)"/>

  <!-- Combined trace / result box -->
  <rect x="840" y="772" width="620" height="92" rx="10" fill="#0c2417" stroke="#22c55e" stroke-width="1.5"/>
  <text x="862" y="802" fill="#4ade80" font-size="14" font-weight="bold">Single combined trace</text>
  <text x="862" y="824" fill="#c9d1d9" font-size="12">user &#8594; agent &#8594; DB row — one forensic row</text>
  <text x="862" y="845" fill="#8b949e" font-size="11">approval · authentication · write &#8212; one forensic row</text>

  <!-- bottom caption -->
  <text x="40" y="908" fill="#fde68a" font-size="12" font-weight="bold">Who authorized what, through which agent, against what system — and have the credentials expired? One query answers it.</text>

</svg>
