<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 770" width="1520" height="770" style="background:#0d1117; font-family: 'Segoe UI', Arial, sans-serif;">

  <rect width="1520" height="770" fill="#0d1117"/>

  <!-- Title -->
  <text x="32" y="42" fill="white" font-size="21" font-weight="bold">IBM Verify Identity Access — Self-Contained Stack on EKS</text>
  <text x="32" y="62" fill="#8b949e" font-size="12">verify-access namespace · 7 pods · in-cluster directory + HVDB (no AWS Simple AD, no shared RDS)</text>

  <!-- Badge -->
  <rect x="1300" y="22" width="190" height="34" rx="17" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="1316" y="44" fill="#22c55e" font-size="12" font-weight="bold">✓ Self-contained</text>

  <defs>
    <marker id="m-blue"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
    <marker id="m-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f97316"/></marker>
    <marker id="m-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/></marker>
    <marker id="m-green"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/></marker>
    <marker id="m-teal"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#14b8a6"/></marker>
    <marker id="m-amber"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
  </defs>

  <!-- ===== EXTERNAL ENTRY POINTS (left of namespace) ===== -->
  <!-- Internet / Browser -->
  <rect x="32" y="120" width="150" height="62" rx="10" fill="#0a1626" stroke="#3b82f6" stroke-width="2"/>
  <text x="107" y="148" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">Internet / Browser</text>
  <text x="107" y="166" fill="#8b949e" font-size="9.5" text-anchor="middle">CIBA consent · auth_code login</text>

  <!-- ALB -->
  <rect x="32" y="214" width="150" height="78" rx="10" fill="#0a1626" stroke="#3b82f6" stroke-width="2"/>
  <text x="107" y="238" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">ALB Ingress</text>
  <text x="107" y="254" fill="#bfdbfe" font-size="9.5" text-anchor="middle">ivia-wrp · internet-facing</text>
  <text x="107" y="269" fill="#8b949e" font-size="9">HTTP:80 → 443 redirect</text>
  <text x="107" y="283" fill="#8b949e" font-size="9">HTTPS backend → :9443</text>

  <!-- Agents / Vault (M2M) -->
  <rect x="32" y="560" width="150" height="86" rx="10" fill="#1a1200" stroke="#f59e0b" stroke-width="2"/>
  <text x="107" y="584" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">Agents / Vault</text>
  <text x="107" y="599" fill="#fde68a" font-size="9.5" text-anchor="middle">machine-to-machine</text>
  <text x="107" y="615" fill="#8b949e" font-size="9">CIBA bc-authorize ·</text>
  <text x="107" y="628" fill="#8b949e" font-size="9">token exchange · ROPC</text>
  <text x="107" y="641" fill="#8b949e" font-size="9">Vault JWT auth (issuer)</text>

  <!-- Internet -> ALB -->
  <line x1="107" y1="182" x2="107" y2="212" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#m-blue)"/>
  <text x="116" y="202" fill="#60a5fa" font-size="9">HTTPS</text>

  <!-- ===== NAMESPACE BOX ===== -->
  <rect x="230" y="92" width="1262" height="566" rx="12" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="248" y="114" fill="#8b949e" font-size="12" font-weight="bold">verify-access namespace (EKS)</text>

  <!-- ===== WRP ===== -->
  <rect x="300" y="150" width="166" height="78" rx="9" fill="#0a1a3f" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="383" y="174" fill="#60a5fa" font-size="11" font-weight="bold" text-anchor="middle">Web Reverse Proxy</text>
  <text x="383" y="190" fill="#bfdbfe" font-size="10" text-anchor="middle">iviawrprp1 · :9443</text>
  <text x="383" y="205" fill="#8b949e" font-size="9" text-anchor="middle">browser entry · junction</text>
  <text x="383" y="219" fill="#8b949e" font-size="9" text-anchor="middle">routing · session mgmt</text>

  <!-- ===== OIDC Provider ===== -->
  <rect x="720" y="150" width="166" height="78" rx="9" fill="#1a0a2e" stroke="#f97316" stroke-width="1.8"/>
  <text x="803" y="174" fill="#fb923c" font-size="11" font-weight="bold" text-anchor="middle">OIDC Provider</text>
  <text x="803" y="190" fill="#fdba74" font-size="10" text-anchor="middle">iviaop · :8436</text>
  <text x="803" y="205" fill="#8b949e" font-size="9" text-anchor="middle">OAuth tokens · JWKS</text>
  <text x="803" y="219" fill="#8b949e" font-size="9" text-anchor="middle">CIBA · mapping rules</text>

  <!-- ===== Config / LMI ===== -->
  <rect x="300" y="300" width="166" height="78" rx="9" fill="#1e1040" stroke="#a855f7" stroke-width="1.8"/>
  <text x="383" y="324" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">Config / LMI</text>
  <text x="383" y="340" fill="#e9d5ff" font-size="10" text-anchor="middle">iviaconfig · :9443</text>
  <text x="383" y="355" fill="#8b949e" font-size="9" text-anchor="middle">source of truth ·</text>
  <text x="383" y="369" fill="#8b949e" font-size="9" text-anchor="middle">publishes snapshot</text>

  <!-- ===== AAC Runtime ===== -->
  <rect x="720" y="300" width="166" height="78" rx="9" fill="#180c2e" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="803" y="324" fill="#c4b5fd" font-size="11" font-weight="bold" text-anchor="middle">AAC Runtime</text>
  <text x="803" y="340" fill="#ddd6fe" font-size="10" text-anchor="middle">iviaruntime · :9443</text>
  <text x="803" y="355" fill="#8b949e" font-size="9" text-anchor="middle">authentication engine</text>
  <text x="803" y="369" fill="#8b949e" font-size="9" text-anchor="middle">policy · credential check</text>

  <!-- ===== DSC ===== -->
  <rect x="1130" y="300" width="166" height="78" rx="9" fill="#161b22" stroke="#6b7280" stroke-width="1.8"/>
  <text x="1213" y="324" fill="#c9d1d9" font-size="11" font-weight="bold" text-anchor="middle">Session Cache</text>
  <text x="1213" y="340" fill="#c9d1d9" font-size="10" text-anchor="middle">iviadsc · :9443/9444</text>
  <text x="1213" y="355" fill="#8b949e" font-size="9" text-anchor="middle">distributed session</text>
  <text x="1213" y="369" fill="#8b949e" font-size="9" text-anchor="middle">cache (db-backed)</text>

  <!-- ===== OpenLDAP ===== -->
  <rect x="470" y="480" width="200" height="84" rx="9" fill="#0c2417" stroke="#22c55e" stroke-width="1.8"/>
  <text x="570" y="506" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">OpenLDAP Directory</text>
  <text x="570" y="522" fill="#bbf7d0" font-size="10" text-anchor="middle">openldap · :636 LDAPS</text>
  <text x="570" y="537" fill="#8b949e" font-size="9" text-anchor="middle">federated registry · secAuthority=Default</text>
  <text x="570" y="551" fill="#8b949e" font-size="9" text-anchor="middle">users: Oscar, Adriana (dc=ibm,dc=com)</text>

  <!-- ===== PostgreSQL ===== -->
  <rect x="860" y="480" width="200" height="84" rx="9" fill="#07221f" stroke="#14b8a6" stroke-width="1.8"/>
  <ellipse cx="884" cy="502" rx="9" ry="4.5" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
  <path d="M875,502 L875,518 Q884,526 893,518 L893,502" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="975" y="506" fill="#2dd4bf" font-size="11" font-weight="bold" text-anchor="middle">PostgreSQL (HVDB)</text>
  <text x="975" y="522" fill="#99f6e4" font-size="10" text-anchor="middle">postgresql · :5432 SSL</text>
  <text x="965" y="537" fill="#8b949e" font-size="9" text-anchor="middle">runtime DB · sessions · cluster</text>
  <text x="965" y="551" fill="#f59e0b" font-size="9" text-anchor="middle">pod-local — NOT shared RDS</text>

  <!-- ===== ARROWS ===== -->
  <!-- ALB -> WRP -->
  <line x1="182" y1="253" x2="300" y2="195" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#m-blue)"/>

  <!-- WRP -> OIDC (/isvaop junction) -->
  <line x1="466" y1="189" x2="718" y2="189" stroke="#f97316" stroke-width="1.8" marker-end="url(#m-orange)"/>
  <text x="592" y="180" fill="#fb923c" font-size="9.5" text-anchor="middle">/isvaop junction (ssl)</text>

  <!-- Agents (M2M) -> OIDC direct (bypass WRP) -->
  <line x1="182" y1="575" x2="720" y2="210" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#m-amber)"/>
  <text x="455" y="372" fill="#fbbf24" font-size="9.5" transform="rotate(-34 455 372)">direct ClusterIP :8436 — bypasses WRP</text>

  <!-- Config -> WRP snapshot -->
  <line x1="383" y1="300" x2="383" y2="230" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#m-purple)"/>
  <!-- Config -> Runtime snapshot -->
  <line x1="466" y1="339" x2="718" y2="339" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#m-purple)"/>
  <text x="592" y="333" fill="#c084fc" font-size="9" text-anchor="middle">LMI snapshot</text>
  <text x="383" y="265" fill="#c084fc" font-size="8.5" text-anchor="middle">snapshot</text>

  <!-- Runtime -> OpenLDAP (LDAPS 636) -->
  <line x1="760" y1="378" x2="610" y2="480" stroke="#22c55e" stroke-width="1.6" marker-end="url(#m-green)"/>
  <text x="640" y="438" fill="#4ade80" font-size="9" text-anchor="middle">LDAPS :636</text>

  <!-- Runtime -> PostgreSQL (5432) -->
  <line x1="828" y1="378" x2="930" y2="480" stroke="#14b8a6" stroke-width="1.6" marker-end="url(#m-teal)"/>
  <text x="905" y="438" fill="#2dd4bf" font-size="9">:5432</text>

  <!-- OIDC -> PostgreSQL (runtime_db hvdb) -->
  <line x1="836" y1="228" x2="970" y2="480" stroke="#14b8a6" stroke-width="1.6" marker-end="url(#m-teal)"/>
  <text x="918" y="356" fill="#2dd4bf" font-size="9" transform="rotate(62 918 356)">hvdb :5432</text>

  <!-- DSC -> PostgreSQL (5432) -->
  <line x1="1130" y1="372" x2="1045" y2="482" stroke="#14b8a6" stroke-width="1.6" marker-end="url(#m-teal)"/>
  <text x="1110" y="438" fill="#2dd4bf" font-size="9">:5432</text>

  <!-- ===== LEGEND / NOTES ===== -->
  <rect x="32" y="676" width="1456" height="78" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="52" y="697" fill="#8b949e" font-size="10.5" font-weight="bold">HOW IT FITS TOGETHER</text>

  <text x="52" y="716" fill="#8b949e" font-size="10">• Browser flows enter via the ALB → WRP, which junctions only <tspan fill="#fb923c">/isvaop</tspan> to the OIDC Provider. There is no /mga junction — the AAC Runtime is not WRP-fronted.</text>
  <text x="52" y="732" fill="#8b949e" font-size="10">• Machine-to-machine flows (CIBA bc-authorize, token exchange, ROPC) and Vault JWT-auth issuer validation hit <tspan fill="#fdba74">iviaop ClusterIP :8436</tspan> directly, bypassing the WRP.</text>
  <text x="52" y="748" fill="#8b949e" font-size="10">• <tspan fill="#c084fc">iviaconfig (LMI)</tspan> is the single source of truth — every pod pulls its published snapshot. The directory (<tspan fill="#4ade80">OpenLDAP</tspan>) and HVDB (<tspan fill="#2dd4bf">PostgreSQL</tspan>) are in-cluster pods — no AWS Simple AD, no shared RDS.</text>

</svg>
