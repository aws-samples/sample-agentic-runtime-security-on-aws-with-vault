<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 900" width="1540" height="900" style="background:#0d1117; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;">

  <rect width="1540" height="900" fill="#0d1117"/>

  <!-- Title -->
  <text x="770" y="44" text-anchor="middle" font-size="26" font-weight="600" fill="#e6edf3">Identity-plane responsibility split</text>
  <text x="770" y="74" text-anchor="middle" font-size="15" fill="#8b949e">IBM Verify (left)  ·  HashiCorp Vault (right)</text>

  <!-- ============================== LEFT COLUMN — IBM Verify ============================== -->
  <rect x="40" y="100" width="680" height="770" rx="12" fill="#0a1626" stroke="#3b82f6" stroke-width="2"/>
  <text x="380" y="142" text-anchor="middle" font-size="22" font-weight="700" fill="#60a5fa">IBM Verify Identity Access (IVIA)</text>
  <text x="380" y="170" text-anchor="middle" font-size="13" fill="#f59e0b">user identity plane</text>

  <!-- IVIA row 1 — user authn (IDP) -->
  <rect x="70" y="200" width="620" height="110" rx="8" fill="#161b22" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="235" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">user authn (IDP)</text>
  <text x="380" y="270" text-anchor="middle" font-size="13" fill="#8b949e">username/password, MFA</text>

  <!-- IVIA row 2 — OAuth Auth Code + PKCE -->
  <rect x="70" y="325" width="620" height="110" rx="8" fill="#161b22" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="360" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">OAuth: Authorization Code + PKCE</text>
  <text x="380" y="395" text-anchor="middle" font-size="13" fill="#8b949e">scopes (read:own, write:own), code_verifier</text>

  <!-- IVIA row 3 — CIBA -->
  <rect x="70" y="450" width="620" height="110" rx="8" fill="#161b22" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="485" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">CIBA out-of-band approval</text>
  <text x="380" y="520" text-anchor="middle" font-size="13" fill="#8b949e">backchannel auth, push notification, polling</text>

  <!-- IVIA row 4 — RAR authorization_details -->
  <rect x="70" y="575" width="620" height="110" rx="8" fill="#161b22" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="610" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">RAR authorization_details</text>
  <text x="380" y="645" text-anchor="middle" font-size="13" fill="#8b949e">RFC 9396 fine-grained intent (refund, amount, order)</text>

  <!-- IVIA row 5 — JWT signing key issuance -->
  <rect x="70" y="700" width="620" height="110" rx="8" fill="#161b22" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="735" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">JWT signing key issuance</text>
  <text x="380" y="770" text-anchor="middle" font-size="13" fill="#8b949e">OIDC discovery URL, JWKS endpoint, may_act delegation</text>

  <!-- ============================== RIGHT COLUMN — HashiCorp Vault ============================== -->
  <rect x="820" y="100" width="680" height="770" rx="12" fill="#1f1608" stroke="#f59e0b" stroke-width="2"/>
  <text x="1160" y="142" text-anchor="middle" font-size="22" font-weight="700" fill="#fbbf24">HashiCorp Vault</text>
  <text x="1160" y="170" text-anchor="middle" font-size="13" fill="#60a5fa">workload identity + secret-broker plane</text>

  <!-- Vault row 1 — workload K8s auth -->
  <rect x="850" y="200" width="620" height="110" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1160" y="235" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">workload Kubernetes auth</text>
  <text x="1160" y="270" text-anchor="middle" font-size="13" fill="#8b949e">ServiceAccount JWT projected, role binds SA → Vault role</text>

  <!-- Vault row 2 — jwt auth (bound to Verify OIDC) -->
  <rect x="850" y="325" width="620" height="110" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1160" y="360" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">jwt auth (bound to Verify OIDC)</text>
  <text x="1160" y="395" text-anchor="middle" font-size="13" fill="#8b949e">discovery_url, bound_audiences, bound_claims (may_act.sub)</text>

  <!-- Vault row 3 — Postgres database secrets engine -->
  <rect x="850" y="450" width="620" height="110" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1160" y="485" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">Postgres database secrets engine</text>
  <text x="1160" y="520" text-anchor="middle" font-size="13" fill="#8b949e">creation_statements, revocation_statements, TTL=15m</text>

  <!-- Vault row 4 — AWS secrets engine (STS) -->
  <rect x="850" y="575" width="620" height="110" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1160" y="610" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">AWS secrets engine (STS)</text>
  <text x="1160" y="645" text-anchor="middle" font-size="13" fill="#8b949e">assumed_role, scoped Bedrock policies, TTL=15m</text>

  <!-- Vault row 5 — audit device → fluent-bit → CloudWatch -->
  <rect x="850" y="700" width="620" height="110" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1160" y="735" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">audit device → fluent-bit → CloudWatch</text>
  <text x="1160" y="770" text-anchor="middle" font-size="13" fill="#8b949e">JSON-line audit trail, request_id propagated</text>

  <!-- ============================== TRUST ARROW (IVIA → Vault, bridges row 2) ============================== -->
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Connector arrow: from right edge of IVIA row 2 to left edge of Vault row 2, at row-2 vertical center (y=380) -->
  <line x1="690" y1="380" x2="850" y2="380" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Top label above arrow: OIDC discovery URL trust -->
  <text x="770" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#fbbf24">OIDC discovery URL trust</text>
  <!-- Bottom label below arrow: JWT signing key handoff -->
  <text x="770" y="406" text-anchor="middle" font-size="12" fill="#f59e0b" font-style="italic">JWT signing key handoff</text>

</svg>
