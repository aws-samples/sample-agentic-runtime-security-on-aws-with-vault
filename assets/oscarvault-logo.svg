<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 152" role="img" aria-label="OscarVault International">
  <title>OscarVault International (OVI)</title>

  <!-- ===== Shield mark with OVI monogram ===== -->
  <g transform="translate(130 44)">
    <path d="M0,-42 L37,-30 V3 C37,27 21,41 0,47 C-21,41 -37,27 -37,3 V-30 Z" fill="#0f62fe"/>
    <path d="M0,-42 L37,-30 V3 C37,27 21,41 0,47 C-21,41 -37,27 -37,3 V-30 Z" fill="none" stroke="#0043ce" stroke-width="1.5"/>
    <text x="0" y="9" text-anchor="middle"
          font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
          font-size="25" font-weight="700" letter-spacing="0.5" fill="#ffffff">OVI</text>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="130" y="120" text-anchor="middle"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="-0.5" fill="#161616">OscarVault</text>

  <!-- ===== Sub-wordmark ===== -->
  <text x="130" y="139" text-anchor="middle"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="10.5" font-weight="500" letter-spacing="5" fill="#697077">INTERNATIONAL</text>
</svg>
