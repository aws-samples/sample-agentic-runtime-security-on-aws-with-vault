<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" style="background:#0d1117; font-family: 'Segoe UI', Arial, sans-serif;">

  <rect width="1280" height="640" fill="#0d1117"/>

  <!-- Title -->
  <text x="32" y="44" fill="white" font-size="21" font-weight="bold">Vault Enterprise native OBO — Agent Registry &amp; per-request RAR</text>
  <text x="32" y="64" fill="#8b949e" font-size="12">Vault resolves the agent from act.sub and narrows every credential in-process — UC2 / UC3 (3-layer)</text>

  <!-- Badge -->
  <rect x="1040" y="20" width="212" height="36" rx="18" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="1056" y="43" fill="#22c55e" font-size="12" font-weight="bold">✓ Enforced inside Vault</text>

  <defs>
    <radialGradient id="arVaultRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>
    <linearGradient id="arRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="33%" stop-color="#a855f7"/>
      <stop offset="66%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>
    <marker id="arP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/></marker>
  </defs>

  <!-- ===== IVIA node ===== -->
  <rect x="32" y="240" width="196" height="120" rx="10" fill="#1a0a2e" stroke="#f97316" stroke-width="2"/>
  <rect x="48" y="262" width="34" height="5" rx="2" fill="#f97316"/>
  <rect x="48" y="271" width="28" height="5" rx="2" fill="#f97316"/>
  <rect x="48" y="280" width="34" height="5" rx="2" fill="#f97316"/>
  <text x="92" y="271" fill="#fb923c" font-size="12" font-weight="bold">IBM Verify (IVIA)</text>
  <text x="48" y="308" fill="#fdba74" font-size="10">Issues delegated OAuth JWT</text>
  <text x="48" y="326" fill="#e6edf3" font-size="10">sub = jaime (human)</text>
  <text x="48" y="342" fill="#e6edf3" font-size="10">act.sub = uc3-actor (agent)</text>
  <text x="48" y="356" fill="#8b949e" font-size="9">vault:path_access RAR (RFC 9396)</text>

  <!-- IVIA → resource server -->
  <line x1="228" y1="300" x2="292" y2="300" stroke="#a855f7" stroke-width="2" marker-end="url(#arP)"/>
  <text x="260" y="290" fill="#c084fc" font-size="9" text-anchor="middle">X-Vault-Token</text>

  <!-- ===== OAuth resource server profile ===== -->
  <rect x="292" y="248" width="196" height="104" rx="10" fill="#0d1117" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="308" y="272" fill="#60a5fa" font-size="11" font-weight="bold">OAuth resource server</text>
  <text x="308" y="290" fill="#8b949e" font-size="9.5">sys/config/oauth-resource-server</text>
  <text x="308" y="310" fill="#bfdbfe" font-size="10">Validates JWT via IVIA JWKS</text>
  <text x="308" y="326" fill="#bfdbfe" font-size="10">(RS256 — the trust seam)</text>
  <text x="308" y="344" fill="#8b949e" font-size="9">reads sub + act.sub claims</text>

  <!-- resource server → registry -->
  <line x1="488" y1="300" x2="552" y2="300" stroke="#a855f7" stroke-width="2" marker-end="url(#arP)"/>

  <!-- ===== Agent Registry ===== -->
  <rect x="552" y="248" width="196" height="104" rx="10" fill="#18102b" stroke="#a855f7" stroke-width="1.8"/>
  <text x="568" y="272" fill="#c084fc" font-size="11" font-weight="bold">Agent Registry</text>
  <text x="568" y="290" fill="#8b949e" font-size="9.5">agent-registry/register</text>
  <text x="568" y="310" fill="#e9d5ff" font-size="10">act.sub → registered agent</text>
  <text x="568" y="326" fill="#e9d5ff" font-size="10">entity alias (uc3-actor)</text>
  <text x="568" y="344" fill="#8b949e" font-size="9">unknown actor → fails closed</text>

  <!-- registry → Vault core -->
  <line x1="748" y1="300" x2="812" y2="300" stroke="#a855f7" stroke-width="2" marker-end="url(#arP)"/>

  <!-- ===== VAULT core ===== -->
  <circle cx="884" cy="300" r="62" fill="url(#arRingGrad)" opacity="0.9"/>
  <circle cx="884" cy="300" r="54" fill="url(#arVaultRing)"/>
  <polygon points="884,274 864,310 904,310" fill="white" opacity="0.9"/>
  <rect x="876" y="284" width="16" height="11" fill="#0d1117"/>
  <text x="884" y="332" fill="white" font-size="12" text-anchor="middle" font-weight="bold">Vault</text>
  <text x="884" y="345" fill="#8b949e" font-size="8.5" text-anchor="middle">OBO authorization</text>

  <!-- Vault → intersection -->
  <line x1="946" y1="300" x2="1008" y2="300" stroke="#a855f7" stroke-width="2" marker-end="url(#arP)"/>

  <!-- ===== 3-LAYER INTERSECTION ===== -->
  <rect x="1008" y="180" width="240" height="240" rx="12" fill="#0a1626" stroke="#3b82f6" stroke-width="2"/>
  <text x="1128" y="206" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">Effective grant = 3-layer ∩</text>

  <rect x="1026" y="220" width="204" height="52" rx="8" fill="#0d2a2a" stroke="#14b8a6" stroke-width="1.6"/>
  <text x="1040" y="240" fill="#2dd4bf" font-size="10" font-weight="bold">Layer 1 — Human baseline</text>
  <text x="1040" y="256" fill="#a7f3d0" font-size="9.5">entity ACL of sub (jaime)</text>
  <text x="1040" y="268" fill="#6b7280" font-size="8.5">what the user may ever do</text>

  <text x="1128" y="286" fill="#8b949e" font-size="13" font-weight="bold" text-anchor="middle">∩</text>

  <rect x="1026" y="292" width="204" height="52" rx="8" fill="#1e1040" stroke="#a855f7" stroke-width="1.6"/>
  <text x="1040" y="312" fill="#c084fc" font-size="10" font-weight="bold">Layer 2 — Agent ceiling</text>
  <text x="1040" y="328" fill="#e9d5ff" font-size="9.5">uc3-agent-ceiling policy</text>
  <text x="1040" y="340" fill="#6b7280" font-size="8.5">max the agent may ever do</text>

  <text x="1128" y="358" fill="#8b949e" font-size="13" font-weight="bold" text-anchor="middle">∩</text>

  <rect x="1026" y="364" width="204" height="52" rx="8" fill="#0a1a3f" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="1040" y="384" fill="#60a5fa" font-size="10" font-weight="bold">Layer 3 — Per-request RAR</text>
  <text x="1040" y="400" fill="#bfdbfe" font-size="9.5">vault:path_access (this call)</text>
  <text x="1040" y="412" fill="#6b7280" font-size="8.5">exact path being requested</text>

  <!-- intersection → scoped credential -->
  <line x1="1128" y1="420" x2="1128" y2="470" stroke="#22c55e" stroke-width="2" marker-end="url(#arG)"/>

  <!-- ===== Scoped credential ===== -->
  <rect x="988" y="478" width="280" height="70" rx="10" fill="#0c2417" stroke="#22c55e" stroke-width="1.8"/>
  <text x="1128" y="502" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">Scoped JIT credential</text>
  <text x="1128" y="520" fill="#a7f3d0" font-size="10" text-anchor="middle">database/creds/uc3-refund-writer</text>
  <text x="1128" y="536" fill="#8b949e" font-size="9.5" text-anchor="middle">TTL 5m · expires with token · no standing privilege</text>

  <!-- ===== LEGEND ===== -->
  <rect x="32" y="420" width="828" height="180" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="52" y="446" fill="#c9d1d9" font-size="12" font-weight="bold">How the native model differs from the retired jwt auth backend</text>

  <text x="52" y="474" fill="#8b949e" font-size="11">• The delegated JWT is presented via <tspan fill="#c084fc">X-Vault-Token</tspan> — Vault is the OAuth resource server, not a jwt-auth login endpoint.</text>
  <text x="52" y="498" fill="#8b949e" font-size="11">• Vault resolves the agent from <tspan fill="#e9d5ff">act.sub</tspan> against the Agent Registry — an unregistered actor fails closed (no entity resolves).</text>
  <text x="52" y="522" fill="#8b949e" font-size="11">• Enforcement happens <tspan fill="#60a5fa">inside Vault</tspan>: human baseline ∩ agent ceiling ∩ per-request <tspan fill="#bfdbfe">vault:path_access</tspan> RAR.</text>
  <text x="52" y="546" fill="#8b949e" font-size="11">• A token whose RAR names a different path is denied <tspan fill="#f87171">even when baseline and ceiling both permit the target</tspan>.</text>
  <text x="52" y="570" fill="#8b949e" font-size="11">• UC1 is unaffected — it uses Kubernetes workload identity only (one layer: the uc1-readonly floor); registry ceiling is inert.</text>
  <text x="52" y="592" fill="#6b7280" font-size="10">Vault Enterprise 2.0.3 — Agent Registry + OAuth resource server + RAR type vault:path_access.</text>

</svg>
