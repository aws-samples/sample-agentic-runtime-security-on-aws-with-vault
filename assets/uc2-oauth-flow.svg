    <text x="590.0" y="35.3">UC2: Per-user agent — OAuth Authorization Code + PKCE → user-scoped DB creds</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="12" fill="#000000" text-anchor="middle">
    <text x="150.0" y="102.7">user browser</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="12" fill="#000000" text-anchor="middle">
    <text x="370.0" y="95.2">IBM Verify (IVIA)</text>
    <text x="370.0" y="110.2">OAuth + PKCE</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="12" fill="#000000" text-anchor="middle">
    <text x="590.0" y="102.7">agent uc2</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="12" fill="#000000" text-anchor="middle">
    <text x="810.0" y="95.2">Vault</text>
    <text x="810.0" y="110.2">jwt auth</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="12" fill="#000000" text-anchor="middle">
    <text x="1030.0" y="95.2">RDS Postgres</text>
    <text x="1030.0" y="110.2">(per-user data)</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="11" fill="#e67700" text-anchor="middle">
    <text x="215.0" y="155.3">1. /authorize + PKCE</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="11" fill="#e67700" text-anchor="middle">
    <text x="215.0" y="205.3">2. login UI</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="11" fill="#e67700" text-anchor="middle">
    <text x="215.0" y="255.3">3. credentials + code_verifier</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="11" fill="#e67700" text-anchor="middle">
    <text x="215.0" y="305.4">4. authorization code</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="11" fill="#e67700" text-anchor="middle">
    <text x="325.0" y="355.4">5. code  request_id</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="11" fill="#e67700" text-anchor="middle">
    <text x="390.0" y="405.4">6. POST /token (code+verifier)</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="11" fill="#e67700" text-anchor="middle">
    <text x="390.0" y="455.4">7. user JWT (sub=alice, scope=read:own)</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="11" fill="#1971c2" text-anchor="middle">
    <text x="610.0" y="505.4">8. Vault login: jwt auth  bound_audiences=[agent-uc2]</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="11" fill="#2f9e44" text-anchor="middle">
    <text x="610.0" y="555.4">9. user/pwd scoped to alice  request_id</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="11" fill="#2f9e44" text-anchor="middle">
    <text x="720.0" y="605.4">10. SELECT WHERE owner=alice</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="11" fill="#2f9e44" text-anchor="middle">
    <text x="720.0" y="655.4">11. INSERT rejected (Layer 2 GRANTs)</text>
  </g>
  <g font-family="Segoe Print, Comic Sans MS, Caveat, cursive" font-size="13" fill="#000000" text-anchor="middle">
    <text x="580.0" y="756.0">scope enforcement: write attempts rejected at Layer 2 (DB GRANTs), even if Layer 1 (Vault role) misconfigured</text>
  </g>
</svg>