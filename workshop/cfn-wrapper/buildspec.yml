version: 0.2
# Hybrid tier-1 buildspec — production version for Workshop Studio CFN wrapper.
# This file is the canonical source; its content is embedded verbatim in
# workshop/static/cfn_bootstrap.yml (AWS::CodeBuild::Project Source.BuildSpec).
#
# What this does:
#   install  : pin all tools proven in sim (terraform, kubectl, helm, yq, jq, bc) + requests for CFN callback
#   pre_build: clone repo at pinned tag, bootstrap, inject acme_email, inject non-empty sentinels for
#              tier-2 IVIA secrets (preflight gate checks them unconditionally — they never reach tier-1 TF)
#   build    : deploy-workshop.sh --tier 1 ONLY; stage tier-1 state to S3; grant WSParticipantRole EKS access
#   finally  : PUT SUCCESS/FAILED to CFN callback URL (no-op when not a CFN-triggered build)
env:
  exported-variables:
    - REPO_ROOT

phases:
  install:
    commands:
      - set -e
      - export HOME=/root
      - echo "=== installing tools (terraform, kubectl, helm, yq, bc, jq) ==="
      - TF_VERSION=1.10.5
      - curl -fsSL -o /tmp/tf.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip && unzip -o /tmp/tf.zip -d /usr/local/bin >/dev/null && terraform version | head -1
      - curl -fsSL -o /usr/local/bin/kubectl https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl && chmod +x /usr/local/bin/kubectl && kubectl version --client | head -1
      - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash >/dev/null 2>&1 && helm version --short
      - curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && chmod +x /usr/local/bin/yq && yq --version
      - command -v bc >/dev/null 2>&1 || (apt-get update -y >/dev/null && apt-get install -y bc >/dev/null)
      - command -v jq >/dev/null 2>&1 || (apt-get update -y >/dev/null && apt-get install -y jq >/dev/null)
      - jq --version
      - pip3 install "requests>=2.27,<3"
  pre_build:
    commands:
      - set -e
      - export HOME=/root
      - echo "=== clone repo at pinned tag ==="
      - rm -rf code 2>/dev/null || true
      - git clone --single-branch -b "$PUBLIC_REPO_BRANCH" --depth 1 "$PUBLIC_REPO" code
      - cd "code/${PUBLIC_REPO_FOLDER#/}"
      - export REPO_ROOT="$PWD"
      - echo "=== bootstrap: seed tfvars from .example + terraform init (all roots) ==="
      - bash infrastructure/scripts/bootstrap.sh --skip-prereq-gate
      - echo "=== inject acme_email (real value, must not be *@example.com) ==="
      - sed -i "s|^acme_email = .*|acme_email = \"${ACME_EMAIL}\"|" infrastructure/terraform.tfvars
      - echo "=== inject non-empty sentinels for tier-2 IVIA secrets ==="
      - echo "    (preflight gate checks all 3 secrets unconditionally; these NEVER reach tier-1 Terraform)"
      - sed -i 's|^icr_entitlement_key = ""|icr_entitlement_key = "tier1-build-only-not-used"|' infrastructure/services/terraform.tfvars
      - sed -i 's|^ivia_mmfa_push_client_secret = ""|ivia_mmfa_push_client_secret = "tier1-build-only-not-used"|' infrastructure/services/terraform.tfvars
      - echo "acme set:" $(grep -c '^acme_email = ".\+"' infrastructure/terraform.tfvars) "| icr sentinel:" $(grep -c 'tier1-build-only-not-used' infrastructure/services/terraform.tfvars) "lines"
  build:
    commands:
      - |
        set -e; cd "$REPO_ROOT"; export HOME=/root
        SCR=infrastructure/scripts

        echo "=== TIER 1: deploy-workshop.sh --tier 1 ==="
        bash "$SCR/deploy-workshop.sh" --tier 1

        echo "=== STAGE tier-1 state + tfvars to S3 ==="
        aws s3 cp infrastructure/terraform.tfstate "s3://${STATE_BUCKET}/infrastructure/terraform.tfstate"
        aws s3 cp infrastructure/terraform.tfvars  "s3://${STATE_BUCKET}/infrastructure/terraform.tfvars.staged"

        echo "=== GRANT attendee EKS access (WSParticipantRole — discovered dynamically, never hardcoded) ==="
        CLUSTER_NAME=$(grep '^cluster_name' infrastructure/terraform.tfvars | sed 's/.*"\(.*\)"/\1/')
        REGION=$(grep '^region' infrastructure/terraform.tfvars | sed 's/.*"\(.*\)"/\1/')
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        PARTICIPANT_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/WSParticipantRole"

        aws eks create-access-entry \
          --cluster-name "$CLUSTER_NAME" --region "$REGION" \
          --principal-arn "$PARTICIPANT_ROLE_ARN" --type STANDARD 2>/dev/null || \
          echo "access-entry already exists — idempotent"

        aws eks associate-access-policy \
          --cluster-name "$CLUSTER_NAME" --region "$REGION" \
          --principal-arn "$PARTICIPANT_ROLE_ARN" \
          --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy \
          --access-scope type=cluster 2>/dev/null || \
          echo "policy already associated — idempotent"

        echo "=== TIER 1 complete; attendee EKS access granted to ${PARTICIPANT_ROLE_ARN} ==="
  finally:
    commands:
      - pip3 install "requests>=2.27,<3"
      - |
        python3 - <<'PYEOF'
        import json, os
        try:
            import requests
        except ImportError:
            print("requests not available — cannot notify CloudFormation"); exit(0)
        resp_url = os.environ.get("CFN_EVENT_RESPONSE_URL")
        if not resp_url:
            print("No CFN response URL — not a CFN-triggered build, no-op"); exit(0)
        data = json.loads(os.environ["CFN_EVENT_DATA"])
        data["Status"] = "SUCCESS" if int(os.environ.get("CODEBUILD_BUILD_SUCCEEDING", "0")) else "FAILED"
        data["Reason"] = "See CodeBuild logs: /aws/codebuild/workshop-tier1"
        data["Data"] = {"StateBucketName": os.environ.get("STATE_BUCKET", "")}
        response = requests.put(resp_url, data=json.dumps(data))
        print(f"CFN notified: {data['Status']} (HTTP {response.status_code})")
        PYEOF
