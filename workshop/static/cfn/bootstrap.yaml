---
AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  CloudFormation bootstrap for the Agentic Runtime Security on AWS workshop.
  Provisions tier-1 (EKS foundation, 183 resources, ~17 min) via CodeBuild before
  the attendee session opens. Attendees run tier-2/3 themselves as the hands-on lesson.
  Source pattern: CodeBuild sources workshop/assets/ from S3 (TerraformSourceBucket) —
  no git clone, no public mirror. Template location: workshop/assets/cfn/bootstrap.yaml

Parameters:
  AcmeEmail:
    Type: String
    NoEcho: true
    Description: >-
      Let's Encrypt registration email for TLS certificate issuance (ACME).
      Must be a real, reachable address — not *@example.com.
      Event organizer fills this in the Workshop Studio event config.

  TerraformSourceBucket:
    Type: String
    Description: >-
      S3 bucket holding the uploaded workshop/assets/ tree (buildspec/ + terraform/).
      In Workshop Studio this is the per-workshop assets bucket that `aws s3 sync
      ./assets` populates; for the dev-account sim it is a bucket you create and upload
      to. CodeBuild sources buildspec/buildspec.yml and terraform/ from here.

  AssetsKeyPrefix:
    Type: String
    Default: ""
    Description: >-
      Key prefix (with trailing slash) under TerraformSourceBucket where the assets
      live — e.g. "agentic-runtime-security-aws/" in Workshop Studio. Leave empty when
      assets are uploaded to the bucket root (dev-account sim).

  AttendeeRoleName:
    Type: String
    Default: WSParticipantRole
    Description: >-
      IAM role NAME (not ARN) of the attendee identity that must receive EKS
      cluster-admin after tier-1 is provisioned by CodeBuild. In Workshop Studio the
      attendee assumes WSParticipantRole; override only if a real WS event exposes a
      differently-named participant role (verify-on-real-WS). The buildspec builds the
      full ARN as arn:aws:iam::<account-id>:role/<AttendeeRoleName> with the account id
      resolved dynamically via STS — never hardcoded.

  ImageSource:
    Type: String
    Default: ecr
    AllowedValues:
      - ecr
    Description: >-
      How the Use Case container images are sourced at-an-event. ECR is the
      supported at-an-event path: CodeBuild builds the images from source and pushes
      them to the attendee's own ECR (requires PrivilegedMode). The no-build GHCR
      opt-out is a self-paced, bring-your-own-images path only (see the repo README)
      and is not offered at an event. Flows to the buildspec as the IMAGE_SOURCE env
      var and on to bootstrap.sh / deploy-workshop.sh --image-source.

Resources:

  # ─── S3: tier-1 state staging bucket ───────────────────────────────────────
  # Tier-1 Terraform state is staged here after the CodeBuild run so attendees
  # can pull it with `aws s3 cp` at the start of their tier-2/3 session (D-04).
  # Threat T-11-01: SSE-AES256 + public-access block + versioning (no delete on CFN Delete — D-04).
  StateBucket:
    Type: "AWS::S3::Bucket"
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # ─── IAM: CodeBuild execution role ──────────────────────────────────────────
  # INITIAL non-Admin role scoped to tier-1 service namespaces + IAM management
  # (tier-1 Terraform creates 10+ IAM roles; PowerUserAccess alone is insufficient).
  # Threat T-11-03: role is non-Admin (no wildcard-on-star grant). Action set is
  # finalized in plan 11-04 via aws accessanalyzer against a live CloudTrail run.
  CodeBuildServiceRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: Tier1DeployPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Tier1ServiceNamespaces
                Effect: Allow
                Action:
                  - "eks:*"
                  - "ec2:*"
                  - "ecr:*"
                  # tier-1 creates nested CloudFormation stacks via Terraform's
                  # aws_cloudformation_stack (bedrock_kb_index AOSS index +
                  # eks_blueprints_addons usage_telemetry) — CreateStack/DescribeStacks/etc.
                  - "cloudformation:*"
                  - "rds:*"
                  - "s3:*"
                  - "bedrock:*"
                  - "aoss:*"
                  - "logs:*"
                  - "cloudwatch:*"
                  - "firehose:*"
                  - "kms:*"
                  - "acm:*"
                  - "route53:*"
                  - "elasticloadbalancing:*"
                  - "cloudtrail:*"
                  - "athena:*"
                  - "dynamodb:*"
                  - "lambda:*"
                  - "sts:*"
                  - "secretsmanager:*"
                  - "ssm:*"
                  - "ssmmessages:*"
                  - "events:*"
                  - "glue:*"
                  - "opensearch:*"
                  - "aoss:*"
                  - "wafv2:*"
                  - "xray:*"
                  - "tag:*"
                Resource: "*"
              - Sid: Tier1IamManagement
                # Tier-1 Terraform creates IAM roles (fluent-bit, firehose, vault-kms,
                # bedrock-kb, IRSA roles, etc.). IAM management actions are required.
                # PowerUserAccess denies all iam:* — this statement bridges that gap.
                # Scoped to management CRUD actions only; NOT iam:* (which would be Admin).
                Effect: Allow
                Action:
                  - "iam:Create*"
                  - "iam:Attach*"
                  - "iam:Detach*"
                  - "iam:Delete*"
                  - "iam:Get*"
                  - "iam:List*"
                  - "iam:Put*"
                  - "iam:Tag*"
                  - "iam:Untag*"
                  - "iam:Update*"
                  - "iam:PassRole"
                  - "iam:AddRoleToInstanceProfile"
                  - "iam:RemoveRoleFromInstanceProfile"
                Resource: "*"

  # ─── CodeBuild: tier-1 deploy project ──────────────────────────────────────
  # Source.Type=S3 (folder) — CodeBuild downloads the uploaded workshop/assets/ tree
  # from TerraformSourceBucket into $CODEBUILD_SRC_DIR. BuildSpec is read from
  # buildspec/buildspec.yml within that tree; the infrastructure/ tree lives under
  # terraform/. No OAuth, no git clone. (T-11 source-location decision)
  # Environment variables are injected from CFN parameters. ACME_EMAIL passes the
  # NoEcho parameter securely — it is NOT echoed in the CFN console. (T-11-02)
  CodeBuildProject:
    Type: "AWS::CodeBuild::Project"
    Properties:
      ConcurrentBuildLimit: 1
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: "aws/codebuild/standard:7.0"
        # Required to run the Docker daemon: in `ecr` image-source mode the buildspec
        # builds the Use Case images from source and pushes them to the attendee's ECR
        # (`docker build`/`docker push`). The standard:7.0 image ships Docker; privileged
        # mode starts the daemon. Proven end-to-end in a dev-account CodeBuild build.
        PrivilegedMode: true
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: STATE_BUCKET
            Type: PLAINTEXT
            Value: !Ref StateBucket
          - Name: ACME_EMAIL
            Type: PLAINTEXT
            Value: !Ref AcmeEmail
          - Name: ATTENDEE_ROLE_NAME
            Type: PLAINTEXT
            Value: !Ref AttendeeRoleName
          - Name: IMAGE_SOURCE
            Type: PLAINTEXT
            Value: !Ref ImageSource
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Source:
        Type: S3
        Location: !Sub "${TerraformSourceBucket}/${AssetsKeyPrefix}"
        BuildSpec: buildspec/buildspec.yml
      TimeoutInMinutes: 60
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: "/aws/codebuild/workshop-tier1"

  # ─── IAM: Lambda trigger execution role ────────────────────────────────────
  # Lambda role for the Custom::CodeBuildTrigger function.
  # AWSLambdaBasicExecutionRole for CloudWatch Logs + StartBuild on THIS project only.
  # Threat T-11-06: StartBuild scoped to single project ARN (not "*").
  CodeBuildTriggerExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: RunCodeBuildProject
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunCodeBuild
                Effect: Allow
                Action:
                  - "codebuild:StartBuild"
                Resource:
                  - !GetAtt CodeBuildProject.Arn

  # ─── Lambda: Custom::CodeBuildTrigger function ──────────────────────────────
  # Starts the CodeBuild project on CFN Create/Update/Delete.
  # Handler code copied verbatim from:
  # aws-samples/sample-iac-cloudformation-wrapper/terraform-project/cfn_bootstrap.yml
  # When CodeBuildCallback=true, injects CFN_EVENT_DATA + CFN_EVENT_RESPONSE_URL as
  # env var overrides so the buildspec finally block can PUT the callback response.
  CodeBuildTriggerFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      Description: "Custom::CodeBuildTrigger — starts CodeBuild with CFN callback env vars injected"
      Handler: "index.lambda_handler"
      MemorySize: 128
      Role: !GetAtt CodeBuildTriggerExecutionRole.Arn
      Runtime: python3.13
      Timeout: 900
      Code:
        ZipFile: |
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          """Custom CloudFormation Resource to kick off CodeBuild project builds

          CFn Properties
          --------------
          ProjectName : string
              Name of the AWS CodeBuild project to run
          BuildOnDelete : Optional[bool]
              Set `True` to also run a build on CloudFormation `Delete` events
          CodeBuildCallback : Optional[bool]
              Set `True` if your CodeBuild project handles the CFN CR callback,
              or leave default (False) to report success as soon as build starts.
          IgnoreUpdate : Optional[bool]
              Set `True` to only trigger a build on initial `Create` and ignore `Update`s

          CodeBuild Env Var Overrides (injected when CodeBuildCallback=true)
          ---------------------------
          CFN_EVENT_TYPE : Union["Create", "Update", "Delete"]
          CFN_EVENT_DATA : str
              JSON with LogicalResourceId, RequestId, StackId, NoEcho, Data.
              Your buildspec finally block adds Status, Reason, PhysicalResourceId
              and PUTs the whole object to CFN_EVENT_RESPONSE_URL.
          CFN_EVENT_RESPONSE_URL : str
              URL to PUT the CloudFormation response data to.
          """

          import json
          import logging
          import traceback

          import boto3
          import cfnresponse

          codebuild = boto3.client("codebuild")


          def _flag(value):
              # CloudFormation serialises custom-resource properties as STRINGS, so a
              # template `BuildOnDelete: false` arrives as the string "false" — which is
              # truthy in Python. Coerce explicitly so false flags stay false. Without this,
              # every stack rollback/delete fires a spurious build that re-runs the deploy.
              return str(value).strip().lower() in ("true", "1", "yes")


          def lambda_handler(event, context):
              try:
                  request_type = event["RequestType"]
                  if request_type == "Create":
                      handle_create(event, context)
                  elif request_type == "Update":
                      handle_update(event, context)
                  elif request_type == "Delete":
                      handle_delete(event, context)
                  else:
                      cfnresponse.send(
                          event, context, cfnresponse.FAILED, {},
                          reason=f"Unsupported CFN RequestType '{request_type}'",
                      )
              except Exception as e:
                  logging.error("Uncaught exception in CFN custom resource handler - reporting failure")
                  traceback.print_exc()
                  cfnresponse.send(
                      event, context, cfnresponse.FAILED, {},
                      reason=f"See CloudWatch {context.log_group_name} > {context.log_stream_name} - {str(e)}",
                  )
                  raise e


          def get_cfn_env_var_overrides(event):
              res_config = event.get("ResourceProperties", {})
              result = [
                  {"name": "CFN_EVENT_TYPE", "type": "PLAINTEXT", "value": event["RequestType"]},
              ]
              if _flag(res_config.get("CodeBuildCallback")):
                  result += [
                      {
                          "name": "CFN_EVENT_DATA",
                          "type": "PLAINTEXT",
                          "value": json.dumps({
                              "LogicalResourceId": event["LogicalResourceId"],
                              "PhysicalResourceId": event["LogicalResourceId"],
                              "RequestId": event["RequestId"],
                              "StackId": event["StackId"],
                              "NoEcho": event["ResourceProperties"].get("NoEcho", False),
                              "Data": {},
                          }),
                      },
                      {
                          "name": "CFN_EVENT_RESPONSE_URL",
                          "type": "PLAINTEXT",
                          "value": event["ResponseURL"],
                      },
                  ]
              return result


          def handle_create(event, context):
              logging.info("**Received create request - running CodeBuild job")
              res_config = event["ResourceProperties"]
              codebuild_env_vars = get_cfn_env_var_overrides(event)
              result = codebuild.start_build(
                  projectName=res_config["ProjectName"],
                  environmentVariablesOverride=codebuild_env_vars,
              )
              if not res_config.get("CodeBuildCallback"):
                  cfnresponse.send(
                      event, context, cfnresponse.SUCCESS,
                      {"Reason": f"Started CodeBuild #{result['build']['buildNumber']}"},
                      physicalResourceId=event["LogicalResourceId"],
                  )


          def handle_delete(event, context):
              logging.info("**Received delete event - no-op")
              res_config = event.get("ResourceProperties", {})
              build_on_delete = _flag(res_config.get("BuildOnDelete"))
              if build_on_delete:
                  codebuild_env_vars = get_cfn_env_var_overrides(event)
                  codebuild.start_build(
                      projectName=res_config["ProjectName"],
                      environmentVariablesOverride=codebuild_env_vars,
                  )
                  reason = "Deletion build initiated"
              else:
                  reason = "Delete is a no-op"
              if not (build_on_delete and _flag(res_config.get("CodeBuildCallback"))):
                  cfnresponse.send(
                      event, context, cfnresponse.SUCCESS, {"Reason": reason},
                      physicalResourceId=event["PhysicalResourceId"],
                  )


          def handle_update(event, context):
              logging.info("**Received update event")
              res_config = event.get("ResourceProperties", {})
              ignore_update = _flag(res_config.get("IgnoreUpdate"))
              if ignore_update:
                  reason = "Update is a no-op"
              else:
                  codebuild_env_vars = get_cfn_env_var_overrides(event)
                  result = codebuild.start_build(
                      projectName=res_config["ProjectName"],
                      environmentVariablesOverride=codebuild_env_vars,
                  )
                  if _flag(res_config.get("CodeBuildCallback")):
                      reason = None
                  else:
                      reason = f"Started CodeBuild #{result['build']['buildNumber']}"
              if reason is not None:
                  cfnresponse.send(
                      event, context, cfnresponse.SUCCESS, {"Reason": reason},
                      physicalResourceId=event["PhysicalResourceId"],
                  )

  # ─── Custom Resource: fire the CodeBuild tier-1 build on stack CREATE/DELETE ──
  # BuildOnDelete: true  → CFN Delete triggers a teardown build (the buildspec's Delete
  #   branch runs teardown.sh), so deleting the stack tears down tier-1 too — symmetric
  #   provision/deprovision via the stack. CFN waits for the finally callback; the 60-min
  #   CodeBuild timeout is the backstop so a stuck teardown can't block stack deletion forever.
  # CodeBuildCallback: true → CFN waits for the buildspec finally block to PUT response (D-13)
  # IgnoreUpdate: true → pinned deploy; don't re-run on parameter changes mid-event
  Tier1Deployment:
    Type: "Custom::CodeBuildTrigger"
    DependsOn:
      - CodeBuildProject
      - CodeBuildTriggerFunction
    Properties:
      ServiceToken: !GetAtt CodeBuildTriggerFunction.Arn
      ProjectName: !Ref CodeBuildProject
      BuildOnDelete: true
      CodeBuildCallback: true
      IgnoreUpdate: true

Outputs:
  CodeBuildProjectName:
    Description: "Name of the CodeBuild project that ran tier-1"
    Value: !Ref CodeBuildProject

  StateBucketName:
    Description: "S3 bucket holding the staged tier-1 Terraform state (attendees pull from here)"
    Value: !Ref StateBucket

  CodeBuildConsoleLink:
    Description: "Direct link to the CodeBuild project in the AWS console"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/${AWS::AccountId}/projects/${CodeBuildProject}"
