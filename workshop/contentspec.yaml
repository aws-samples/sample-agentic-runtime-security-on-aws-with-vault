# AWS Workshop Studio v2 manifest for the Agentic Runtime Security on AWS workshop.
# Schema: https://docs.aws.amazon.com/workshop-studio/latest/

version: 2.0

defaultLocaleCode: en-US
localeCodes:
  - en-US

awsAccountConfig:
  accountSources:
    - WorkshopStudio
  participantRole:
    # INITIAL composition for the tier-2/3 attendee AWS-API surface.
    # ReadOnlyAccess: broad describe/read (sts:GetCallerIdentity, eks:Describe,
    #   s3:Get/List for state bucket, secretsmanager:Describe/Get, etc.)
    # AWSCertificateManagerFullAccess: acm:ImportCertificate (tier-2 TLS setup)
    # AmazonBedrockFullAccess: bedrock-agent:StartIngestionJob (tier-2 KB seed)
    # SecretsManagerReadWrite: secrets read/write for Vault + IVIA config (tier-2)
    # AmazonEC2ContainerRegistryPowerUser: ECR push/pull for image builds (tier-2)
    # This composition is validated and tightened in plan 11-05 via a live tier-2/3 run.
    # Scoped to the tier-2/3 surface only — not a wildcard-on-star grant.
    managedPolicies:
      - arn:aws:iam::aws:policy/ReadOnlyAccess
      - arn:aws:iam::aws:policy/AWSCertificateManagerFullAccess
      - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      - arn:aws:iam::aws:policy/SecretsManagerReadWrite
      - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
  regionConfiguration:
    minAccessibleRegions: 1
    maxAccessibleRegions: 1
    accessibleRegions:
      required:
        - us-west-2
    deployableRegions:
      required:
        - us-west-2

infrastructure:
  cloudformationTemplates:
    - templateLocation: assets/cfn/bootstrap.yaml
      label: "Workshop Foundation (EKS + Vault) — CloudFormation Bootstrap"
      participantAllStackOutputsVisible: true
      # AcmeEmail: event organizer fills this in Workshop Studio event config (NoEcho in CFN).
      # TerraformSourceBucket + AssetsKeyPrefix: where `aws s3 sync ./assets` (publish.sh)
      # lands the workshop/assets/ tree — CodeBuild sources buildspec/ + terraform/ from here.
      # VERIFY-ON-REAL-WS: the WS asset store is ws-assets-us-east-1 (us-east-1) while
      # CodeBuild runs in us-west-2; confirm the region-local bucket WS exposes to the
      # template at event time, and adjust TerraformSourceBucket if WS injects a different one.
      parameters:
        - templateParameter: AcmeEmail
          defaultValue: ""
        - templateParameter: TerraformSourceBucket
          defaultValue: "ws-assets-us-east-1"
        - templateParameter: AssetsKeyPrefix
          defaultValue: "agentic-runtime-security-aws/"

# NOTE (Phase 1 Open Question 1): Service quota requests are NOT in the verified v2 schema
# surface. Quota provisioning is documented in workshop/content/20-prerequisites/ as
# attendee-run `aws service-quotas request-service-quota-increase` commands until
# Workshop Studio's quota-request mechanism is confirmed. Do NOT add a service-quotas
# manifest block here speculatively (the v2 schema does not advertise it) -- doing so
# will fail Workshop Studio submission validation.
#
# CONTEXT-locked quotas (must be provisioned before account hand-off, via Workshop Studio
# admin UI at publish time once contentspec.yaml is uploaded):
#   - EC2 standard vCPU (code L-1216C47A, target >= 32)
#   - VPC Elastic IPs (code L-0263D0A3, target >= 6)
#   - RDS DB instances per region (code L-7B6409FD, target >= 1)
#   - OpenSearch Serverless OCU indexing (code L-50FA809B, target >= 2)
#   - OpenSearch Serverless OCU search (code L-4E98D4EB, target >= 2)
# Workshop Studio admin UI: Catalog Builder -> <workshop> -> Account Configuration ->
# Service Quotas tab. See TESTING.md "Workshop Studio quota auto-provisioning" section.
