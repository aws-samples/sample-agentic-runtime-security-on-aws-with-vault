# AWS Workshop Studio v2 manifest for the Agentic Runtime Security on AWS workshop.
# Schema: https://docs.aws.amazon.com/workshop-studio/latest/
# rebuild marker: 2026-08-05 (re-source S3 assets: EDR disabled + Uptycs secrets removed)

version: 2.0

defaultLocaleCode: en-US
localeCodes:
  - en-US

# Content params referenced in pages via :param{key=...}. Single source of truth for
# the deploy region so page copy + the CloudShell button track one value. NOTE: this is
# a STATIC author-defined value (WS does not yet expose a per-event region param). When
# you change the deploy region, update this AND the tier-1 region path.
params:
  region: us-east-1

awsAccountConfig:
  accountSources:
    - WorkshopStudio
  participantRole:
    # INITIAL composition for the tier-2/3 attendee AWS-API surface.
    # ReadOnlyAccess: broad describe/read (sts:GetCallerIdentity, eks:Describe,
    #   s3:Get/List for state bucket, secretsmanager:Describe/Get, etc.)
    # AWSCertificateManagerFullAccess: acm:ImportCertificate (tier-2 TLS setup)
    # AmazonBedrockFullAccess: bedrock-agent:StartIngestionJob (tier-2 KB seed)
    # SecretsManagerReadWrite: secrets read/write for Vault + IVIA config (tier-2)
    # AmazonEC2ContainerRegistryPowerUser: ECR push/pull for image builds (tier-2)
    # This composition is validated and tightened in plan 11-05 via a live tier-2/3 run.
    # Scoped to the tier-2/3 surface only — not a wildcard-on-star grant.
    managedPolicies:
      - arn:aws:iam::aws:policy/ReadOnlyAccess
      - arn:aws:iam::aws:policy/AWSCertificateManagerFullAccess
      - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      - arn:aws:iam::aws:policy/SecretsManagerReadWrite
      - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
      - arn:aws:iam::aws:policy/AWSCloudShellFullAccess
  # The event organizer picks the tier-1 deploy region (us-east-1 or us-west-2) when
  # creating the WS event; the buildspec writes that region into terraform.tfvars so
  # tier-1 follows it (Option A — auto-follow $AWS_DEFAULT_REGION). kb_region is ALWAYS
  # us-east-1 (Nova/KB embeddings are us-east-1-only), so a us-west-2 event still touches
  # us-east-1 for the Knowledge Base — hence BOTH regions must be accessible (max 2).
  #
  # @JONATHAN — two open questions on the us-west-2 path (us-east-1 single-region is
  # proven; us-west-2 is NOT yet validated):
  #   Q1. Is this the right regionConfiguration expression for "organizer chooses ONE
  #       deploy region, KB always us-east-1"? i.e. both in accessibleRegions.required
  #       + maxAccessibleRegions: 2 — or should us-east-1 be required and us-west-2
  #       optional/recommended?
  #   Q2. See the TerraformSourceBucket note below — a us-west-2 event only works if the
  #       WS assets bucket is reachable by the us-west-2 CodeBuild. If it can't be, drop
  #       us-west-2 here (single-region us-east-1) until the buildspec stages assets in
  #       the event region first.
  regionConfiguration:
    minAccessibleRegions: 1
    maxAccessibleRegions: 1
    accessibleRegions:
      required:
        - us-east-1
    deployableRegions:
      required:
        - us-east-1

infrastructure:
  cloudformationTemplates:
    - templateLocation: static/cfn/bootstrap.yaml
      label: "Workshop-Foundation-EKS-Vault-Bootstrap"
      participantAllStackOutputsVisible: true
      # AcmeEmail: OPTIONAL (NoEcho in CFN). Leave blank to register a no-contact Let's Encrypt
      # account (LE deprecated account emails 2025-06-04); the organizer MAY set a real address.
      # TerraformSourceBucket + AssetsKeyPrefix: where `aws s3 sync ./assets` (publish.sh)
      # lands the workshop/assets/ tree — CodeBuild sources buildspec/ + terraform/ from here.
      #
      # @JONATHAN — the load-bearing durability question for the us-west-2 deployableRegion:
      #   CodeBuild sources its S3 input from TerraformSourceBucket, and (per AWS docs, which
      #   we still need to confirm) that bucket must be in the SAME region as the build/stack.
      #   Q: does {{.AssetsBucketName}} resolve to a bucket in the EVENT region (us-west-2
      #      for a us-west-2 event → works), or is it fixed us-east-1 (`ws-assets-us-east-1`,
      #      per your earlier note → a us-west-2 CodeBuild can't source it → us-west-2 event
      #      breaks)?
      #   If it's fixed us-east-1, the durable fix is either (a) drop us-west-2 from
      #   deployableRegions (ship single-region us-east-1), or (b) add a buildspec step that
      #   copies the assets from the us-east-1 store into an in-event-region bucket before
      #   `deploy-workshop.sh` runs. We deliberately did NEITHER yet — pending your answer.
      # The three tier-2 licensing parameters are REQUIRED (MinLength 1, no default)
      # and are supplied ONCE by the event organizer, so that attendees never see or
      # handle them — the entire point of pre-provisioning tier 2 (#21). They are
      # licensed credentials, so there is deliberately no defaultValue: they must
      # not be committed to this repo in any form.
      #
      # userOverridable is what makes a parameter legal here without a default. The
      # Workshop Studio content validator states its own rule in the failure text:
      #   INFRASTRUCTURE_VALIDATION_ERROR: parameter does not have default value in
      #   CFN or ContentSpec and is not user overridable
      # i.e. a parameter needs EITHER a default OR userOverridable. This list
      # previously set neither, so the build was rejected.
      #
      # NOT YET PROVEN (issue #24): that userOverridable: true renders an input at
      # event creation. On a real Workshop Studio build with this list carrying no
      # defaults and no flags, the event-creation flow showed no field for any of
      # the three and they arrived empty, failing the stack on
      # `secretString must have length >= 1`. AcmeEmail is NOT evidence to the
      # contrary — it carries Default: "" in bootstrap.yaml and satisfied the
      # validator on that default, never on being settable. It stays here with its
      # default as the control for that test.
      #
      # TerraformSourceBucket and AssetsKeyPrefix are Workshop Studio's to fill and
      # are pinned userOverridable: false — an organizer editing either one breaks
      # the CodeBuild S3 source.
      parameters:
        - templateParameter: AcmeEmail
          userOverridable: true
        - templateParameter: IcrEntitlementKey
          userOverridable: true
        - templateParameter: VaultEnterpriseLicense
          userOverridable: true
        - templateParameter: IviaMmfaPushClientSecret
          userOverridable: true
        - templateParameter: TerraformSourceBucket
          defaultValue: "{{.AssetsBucketName}}"
          userOverridable: false
        - templateParameter: AssetsKeyPrefix
          defaultValue: "{{.AssetsBucketPrefix}}"
          userOverridable: false

# NOTE (Phase 1 Open Question 1): Service quota requests are NOT in the verified v2 schema
# surface. Quota provisioning is documented in workshop/content/20-prerequisites/ as
# attendee-run `aws service-quotas request-service-quota-increase` commands until
# Workshop Studio's quota-request mechanism is confirmed. Do NOT add a service-quotas
# manifest block here speculatively (the v2 schema does not advertise it) -- doing so
# will fail Workshop Studio submission validation.
#
# CONTEXT-locked quotas (must be provisioned before account hand-off, via Workshop Studio
# admin UI at publish time once contentspec.yaml is uploaded):
#   - EC2 standard vCPU (code L-1216C47A, target >= 32)
#   - VPC Elastic IPs (code L-0263D0A3, target >= 6)
#   - RDS DB instances per region (code L-7B6409FD, target >= 1)
#   - OpenSearch Serverless OCU indexing (code L-50FA809B, target >= 2)
#   - OpenSearch Serverless OCU search (code L-4E98D4EB, target >= 2)
# Workshop Studio admin UI: Catalog Builder -> <workshop> -> Account Configuration ->
# Service Quotas tab. See TESTING.md "Workshop Studio quota auto-provisioning" section.
